name: Publish snapshots
# Only a push to main publishes the snapshot. Other projects compile against the shared
# snapshot coordinates, so what gets published has to be what main holds, not whatever
# branch was pushed last.
#
# The snapshot goes to the snapshot repository of Maven Central, like the snapshots of the
# sibling repositories. Anybody can read it there without a login. Writing needs the
# Central Portal token, the same secrets the release reads, and only this workflow gets it.
"on":
  push:
    branches:
      - "main"
concurrency:
  # One publish of this repository at a time, because snapshot artifacts share their
  # coordinates and two publishes at once overwrite each other. A run which is already
  # running is never cancelled. A run which is only waiting can be taken out by a newer
  # one, because GitHub keeps at most one waiting run per group, and for a publish of
  # main that is what should happen: the newer run carries the newer artifacts. The
  # pull-request build has a group of its own, one per pull request, because it
  # publishes nothing. The release has a group of its own too, so it can run beside a
  # publish: a released version and a snapshot never share their coordinates.
  group: mongodb-changesets-publish
  cancel-in-progress: false
permissions:
  contents: read
  # what 'actions/deploy-pages' in the 'deploy-coverage-report' job needs: 'pages: write'
  # to publish the page, and 'id-token: write' for the token it exchanges with the Pages
  # service. That job names no permissions of its own, so it gets these. The 'publish'
  # job does name its own, which replace these for it - it only uploads the report as an
  # artifact, and that needs neither.
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # the bundle: "Bundle has content that does NOT have a .pom file". The runner image
      # ships 3.10 now, so this job brings its own 3.9, like the release does. Remove this
      # step once a plugin version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 21.0.12+101.0.LTS
          distribution: temurin
          cache: maven
          # the server the 'central-portal' profile of the POM uploads to. The two names are
          # environment variables, and only the step which publishes sets them
          server-id: phactum-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # the profile 'central-portal' sends a version ending in -SNAPSHOT straight to the
      # snapshot repository of Maven Central
      - name: Publish snapshot
        run: mvn --batch-mode --no-transfer-progress deploy -Pcentral-portal
        env:
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
      # The report is already there: the step above runs the whole lifecycle up to
      # 'deploy', and JaCoCo writes the report in 'verify'. So this step only copies it
      # under the name it gets on the web. The name is the last part of the address the
      # badge in README.md reads, and it follows the sibling repositories, which have one
      # report per platform and call them 'spring-boot-report' and 'quarkus-report'.
      - name: Collect the coverage report
        run: |
          mkdir -p coverage
          cp -r target/site/jacoco coverage/coverage-report
      - name: Upload coverage report files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage
      - name: Upload the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7
          if-no-files-found: ignore
  # A job of its own, because the deployment runs in the environment 'github-pages' and
  # the job which builds the artifact must not. It waits for 'publish' and takes the
  # artifact that job uploaded.
  deploy-coverage-report:
    # This workflow starts on a push to main only, so the condition is true for every run
    # it has today. It is here for the day somebody adds a trigger: a page built from
    # another branch would overwrite the report of main.
    if: "${{ github.ref_name == github.event.repository.default_branch }}"
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
